# ==============================================================================
# Production Load Balancer Configuration for AlumniHub
# Reverse Proxy & Load Balancer for multi-instance Next.js cluster
# ==============================================================================

# 1. Upstream pool with least_conn algorithm & keepalive
upstream nextjs_upstream {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 2. Main Server Block
server {
    listen 80;
    listen [::]:80;
    server_name alumni.example.com;

    # Redirect all HTTP traffic to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alumni.example.com;

    # SSL Certificates (Managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/alumni.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/alumni.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payload Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Client body size for image uploads
    client_max_body_size 15M;

    # 3. Static assets cache (served directly / cached at edge)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        access_log off;
    }

    # 4. Proxy all requests to balanced cluster
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        
        # Connection headers for WebSocket & Keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward real client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }
}
